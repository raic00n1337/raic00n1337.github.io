name: DroneWatch Scan

on:
  schedule:
    # Werktags stündlich zwischen 05:00 und 18:00 UTC, am Wochenende zweimal.
    - cron: "17 5-18 * * 1-5"
    - cron: "17 8,16 * * 0,6"
  workflow_dispatch:        # manuell auslösbar über den Actions-Reiter
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dronewatch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scannen und Seite bauen
        env:
          # Optional. Ohne Key läuft alles außer der KI-Ersteinschätzung.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scan.py

      - name: Datenbestand zurückschreiben
        run: |
          git config user.name "dronewatch-bot"
          git config user.email "actions@github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
